name: Release APK

# Push a tag like v0.3.1 (matching versionName 0.3.1 in android/app/build.gradle)
# to build a release-signed APK and publish it, with its SHA-256, as a GitHub Release.
# The in-app updater reads these releases.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build, e.g. v0.3.0'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Unit tests
        run: npm test

      - name: Check tag matches versionName
        run: |
          VERSION_NAME=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" android/app/build.gradle | head -1)
          VERSION_CODE=$(sed -n "s/.*versionCode \([0-9]*\).*/\1/p" android/app/build.gradle | head -1)
          TAG_VERSION="${TAG#v}"
          case "$VERSION_NAME" in "$TAG_VERSION"|"$TAG_VERSION".0) ;; *)
            echo "::error::Tag $TAG does not match versionName $VERSION_NAME"; exit 1;; esac
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Restore signing key
        env:
          FRAMEWISE_KEYSTORE_BASE64: ${{ secrets.FRAMEWISE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$FRAMEWISE_KEYSTORE_BASE64" ]; then
            echo "::error::Secret FRAMEWISE_KEYSTORE_BASE64 is not set"; exit 1
          fi
          echo "$FRAMEWISE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/framewise-release.jks"
          echo "FRAMEWISE_KEYSTORE_FILE=$RUNNER_TEMP/framewise-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        working-directory: android
        env:
          FRAMEWISE_KEYSTORE_PASSWORD: ${{ secrets.FRAMEWISE_KEYSTORE_PASSWORD }}
          FRAMEWISE_KEY_ALIAS: ${{ secrets.FRAMEWISE_KEY_ALIAS }}
          FRAMEWISE_KEY_PASSWORD: ${{ secrets.FRAMEWISE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest lintRelease assembleRelease

      - name: Verify signature and write checksum
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"
          mkdir -p dist
          OUT="Framewise-${VERSION_NAME}-android.apk"
          cp "$APK" "dist/$OUT"
          (cd dist && sha256sum "$OUT" > "$OUT.sha256" && cat "$OUT.sha256")
          rm -f "$RUNNER_TEMP/framewise-release.jks"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Framewise ${VERSION_NAME} for Android (versionCode: ${VERSION_CODE}). Install the APK, or update from inside Framewise (Setup → Updates)."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "Framewise ${VERSION_NAME}" --notes "$NOTES"
          fi
